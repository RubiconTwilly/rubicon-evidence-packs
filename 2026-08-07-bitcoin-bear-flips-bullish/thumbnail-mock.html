<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thumbnail Mock | Benjamin Cowen Just Flipped Bullish</title>
  <style>
    :root { color-scheme: dark; --page:#0b0a09; --ink:#fffdf7; --green:#61f51d; --muted:#aaa39a; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
      background: radial-gradient(circle at 70% 0, rgba(97,245,29,.12), transparent 34%), var(--page);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }
    main { width: min(1280px, 100%); }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:16px; }
    .eyebrow { margin:0 0 8px; color:var(--green); font-size:13px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(28px,4vw,54px); line-height:1; letter-spacing:-.045em; }
    .meta { color:var(--muted); font-size:13px; line-height:1.45; text-align:right; }
    img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border:1px solid rgba(97,245,29,.28); border-radius:18px; box-shadow:0 34px 90px rgba(0,0,0,.65); }
    .note { display:flex; justify-content:space-between; gap:24px; margin-top:14px; color:var(--muted); font-size:13px; }
    body.export { min-height:720px; padding:0; background:#000; }
    body.export main { width:1280px; }
    body.export header, body.export .note { display:none; }
    body.export img { width:1280px; height:720px; border:0; border-radius:0; box-shadow:none; }
    @media (max-width:700px) {
      body { padding:16px; }
      header, .note { align-items:start; flex-direction:column; }
      .meta { text-align:left; }
      img { border-radius:10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Cowen-only packaging</p>
        <h1>Benjamin Cowen Just Flipped Bullish</h1>
      </div>
      <div class="meta">1280 x 720<br>Model: This Bear Is Now Bullish</div>
    </header>
    <img src="thumbnail-cowen-only-v2.png" alt="Benjamin Cowen beside a glowing Bitcoin with the words He's Buying">
    <div class="note">
      <span>One person, one visible action, one idea.</span>
      <span>Feed-size legibility checked at 320 x 180.</span>
    </div>
  </main>
  <script>
    if (new URLSearchParams(location.search).get("export") === "1") document.body.classList.add("export");
  </script>
</body>
</html>
