<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thumbnail Mock | These Bears Just Flipped Bullish</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0b0a09;
      --ink: #fffdf7;
      --gold: #ffbd16;
      --muted: #a8a29a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 0, rgba(255, 177, 15, .12), transparent 34%),
        var(--page);
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    main { width: min(1280px, 100%); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      line-height: 1;
      letter-spacing: -.045em;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: right;
    }

    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(255, 190, 29, .34);
      border-radius: 18px;
      background: #160c05 url("assets/thumbnail-cowen-krown-outlier-bg.png") center / cover no-repeat;
      box-shadow: 0 34px 90px rgba(0, 0, 0, .65);
    }

    .thumb::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(145, 0, 0, .18), transparent 31%, transparent 69%, rgba(255, 179, 0, .1)),
        linear-gradient(180deg, transparent 56%, rgba(0, 0, 0, .22) 68%, rgba(0, 0, 0, .94) 100%);
    }

    .copy {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 1.5%;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: .13em;
      width: 96%;
      transform: translateX(-50%);
      white-space: nowrap;
      text-transform: uppercase;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
      font-size: clamp(58px, 10.4vw, 142px);
      font-weight: 1000;
      line-height: .88;
      letter-spacing: -.025em;
      -webkit-text-stroke: 4px rgba(0, 0, 0, .82);
      paint-order: stroke fill;
      text-shadow:
        0 4px 0 rgba(0, 0, 0, .9),
        0 12px 28px rgba(0, 0, 0, .95);
    }

    .copy .both { color: #fff; }

    .copy .bought {
      color: var(--gold);
      -webkit-text-fill-color: var(--gold);
      text-shadow:
        0 3px 0 #8b3f00,
        0 7px 0 rgba(0, 0, 0, .86),
        0 14px 30px rgba(0, 0, 0, .98);
    }

    .note {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    body.export {
      min-height: 720px;
      padding: 0;
      background: #000;
    }

    body.export main { width: 1280px; }
    body.export header,
    body.export .note { display: none; }
    body.export .thumb {
      width: 1280px;
      height: 720px;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    @media (max-width: 700px) {
      body { padding: 16px; }
      header { align-items: start; flex-direction: column; }
      .meta { text-align: left; }
      .thumb { border-radius: 10px; }
      .copy { -webkit-text-stroke-width: 2px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Outlier-derived mock</p>
        <h1>These Bears Just Flipped Bullish</h1>
      </div>
      <div class="meta">1280 x 720<br>Red-to-gold outlier grammar</div>
    </header>

    <section class="thumb" aria-label="Thumbnail mock showing Benjamin Cowen and Eric Krown with Bitcoin">
      <div class="copy" aria-label="Both bought">
        <span class="both">Both</span>
        <span class="bought">Bought</span>
      </div>
    </section>

    <div class="note">
      <span>Cowen + Krown, one oversized Bitcoin, one readable outcome.</span>
      <span>Mock packaging, not a literal trade receipt.</span>
    </div>
  </main>

  <script>
    if (new URLSearchParams(location.search).get('export') === '1') {
      document.body.classList.add('export');
    }
  </script>
</body>
</html>
